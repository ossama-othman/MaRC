name: C/C++ CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  Ubuntu:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        cxx: [g++, clang++]

    steps:
    - uses: actions/checkout@v2
    - name: dependencies
      run: sudo apt-get -y install g++ clang libcfitsio-dev autoconf-archive texinfo texlive pandoc
    - name: bootstrap
      run: ./bootstrap
    - name: configure
      run: ./configure CXX=${{ matrix.cxx }}
    - name: make
      run: make
    - name: make check
      run: make check
    - name: make distcheck
      run: make distcheck
    - name: make install
      run: sudo make install
    - name: make installcheck
      run: LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH make installcheck
    - name: make uninstall
      run: sudo make uninstall

  macOS:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v2
    - name: dependencies
      run: brew install automake autoconf-archive fmt cfitsio bison texinfo
    - name: bootstrap
      run: ./bootstrap
    - name: configure
      run: CXX=$(brew --prefix llvm)/bin/clang++ ./configure --disable-debug  --disable-silent-rules
    - name: make
      run: make
    - name: make check
      run: make check
    - name: make install
      run: make install
    - name: make installcheck
      run: LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH make installcheck
    - name: make uninstall
      run: make uninstall
